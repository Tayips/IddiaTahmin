<title>IddiaTahmin</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#f4f7f4; --surface:#fff; --fg:#16201a; --muted:#5a675e; --line:#dce4de;
  --accent:#1f6b45; --accent-soft:#e1efe6; --ok:#1f7a45; --ok-soft:#e1f2e7; --bad:#b23a32; --bad-soft:#f9e3e1; --wait:#8a6a12; --wait-soft:#f8f0d8;
  --display:"Bricolage Grotesque", system-ui, sans-serif;
  --body:"Source Sans 3", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f1511; --surface:#172019; --fg:#e3ebe5; --muted:#98a69c; --line:#29352d;
  --accent:#5fc28d; --accent-soft:#1b3125; --ok:#62c98f; --ok-soft:#173023; --bad:#f08a82; --bad-soft:#391d1b; --wait:#e2b54d; --wait-soft:#33290f;
  color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));padding-block:28px 64px}
header h1{font-family:var(--display);font-weight:800;font-size:32px;margin:0;letter-spacing:-.01em}
header p{margin:4px 0 0;color:var(--muted);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:20px}
.stat{background:var(--surface);padding:14px 16px}
.stat b{display:block;font-family:var(--mono);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin-top:10px}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;color:var(--muted);font:600 14px var(--body);padding:7px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
h2{font-family:var(--display);font-size:15px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:24px 0 8px}
.list{display:grid;gap:8px}
.match{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:8px}
.top{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.lg{font-family:var(--mono);font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.teams{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center;font-weight:700;font-size:17px}
.teams .a{text-align:right}
.score{font-family:var(--mono);font-size:18px;font-weight:600;min-width:56px;text-align:center;color:var(--muted)}
.probs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.p{border:1px solid var(--line);border-radius:6px;padding:6px 8px;position:relative;overflow:hidden;font-variant-numeric:tabular-nums}
.p .fill{position:absolute;inset:auto 0 0 0;height:3px;background:var(--line)}
.p.pick{border-color:var(--accent)}
.p.pick .fill{background:var(--accent)}
.p .k{font-size:12px;color:var(--muted)}
.p .v{font-family:var(--mono);font-weight:600}
.p .o{font-size:11px;color:var(--muted)}
.chip{font-family:var(--mono);font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.ok{background:var(--ok-soft);color:var(--ok)}
.bad{background:var(--bad-soft);color:var(--bad)}
.wait{background:var(--wait-soft);color:var(--wait)}
.goals{display:flex;flex-wrap:wrap;gap:6px;font-size:13px}
.g{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-variant-numeric:tabular-nums;display:inline-flex;gap:6px;align-items:center}
.g b{font-family:var(--mono);font-weight:600}
.g.ok{border-color:var(--ok)}
.g.bad{border-color:var(--bad)}
.empty{color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:20px;text-align:center}
table.perf{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:14px;font-variant-numeric:tabular-nums}
table.perf th,table.perf td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--line)}
table.perf th:first-child,table.perf td:first-child{text-align:left}
table.perf th{font-weight:600;color:var(--muted);font-size:13px}
table.perf tr:last-child td{border-bottom:0}
.explain{font-size:13px;color:var(--muted);margin:6px 0 0}
.coupon{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:8px}
.coupon .head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.coupon .head b{font-family:var(--display);font-size:17px}
.leg{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;font-size:14px;border-top:1px solid var(--line);padding-top:7px;font-variant-numeric:tabular-nums}
.leg .m{min-width:0}
.leg .m small{display:block;color:var(--muted);font-size:12px}
.leg .s{font-family:var(--mono);font-weight:600}
.leg .r{font-family:var(--mono);font-size:13px;color:var(--muted);text-align:right}
.coupon .foot{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding-top:8px;font-size:14px}
.coupon .foot b{font-family:var(--mono)}
.match{cursor:pointer}
.match:hover{border-color:var(--accent)}
.match:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.more{font-size:13px;color:var(--accent);font-weight:600}
#detail{display:grid;gap:12px;margin-top:20px}
.back{border:0;background:none;color:var(--accent);font:600 15px var(--body);padding:4px 0;cursor:pointer;justify-self:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:grid;gap:10px}
.panel h3{font-family:var(--display);font-size:15px;margin:0}
.panel p{margin:0;font-size:14px}
.cmp{display:grid;grid-template-columns:28px minmax(0,1fr) 56px 56px 60px;gap:8px;align-items:center;font-size:14px;font-variant-numeric:tabular-nums}
.cmp .h{font-size:12px;color:var(--muted)}
.cmp .num{text-align:right;font-family:var(--mono)}
.bar{height:8px;border-radius:4px;background:var(--line);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:4px}
.bar b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--fg)}
.up{color:var(--ok)}.down{color:var(--bad)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:640px){.two{grid-template-columns:1fr}}
.form{display:flex;gap:4px}
.form span{font-family:var(--mono);font-size:12px;font-weight:600;width:22px;height:22px;display:grid;place-items:center;border-radius:4px}
.games{display:grid;gap:4px;font-size:13px;font-variant-numeric:tabular-nums}
.games div{display:grid;grid-template-columns:52px 18px minmax(0,1fr) 44px;gap:6px}
.games .v{color:var(--muted)}
.games .sc{text-align:right;font-family:var(--mono)}
dl.meta{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:0;font-size:13px}
dl.meta dt{color:var(--muted)}
dl.meta dd{margin:0}
.warn{border:1px solid var(--bad);border-radius:8px;padding:10px 12px;margin:0 0 16px;font-size:14px}
footer{margin-top:40px;font-size:13px;color:var(--muted)}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.teams{font-size:15px}.stat b{font-size:22px}}
</style>
</head>

const OUT = {H: "1", D: "X", A: "2"};
const TR = new Intl.DateTimeFormat("tr-TR", {weekday: "short", day: "numeric", month: "long", timeZone: "Europe/Istanbul"});
const TRT = new Intl.DateTimeFormat("tr-TR", {hour: "2-digit", minute: "2-digit", timeZone: "Europe/Istanbul"});
const DAY = new Intl.DateTimeFormat("tr-TR", {day: "numeric", month: "short", timeZone: "UTC"});
const STALE_HOURS = 30;                 // günde iki çalışma var; bundan eskiyse bir şey ters gitmiştir
const pct = v => v == null ? "–" : `%${(v * 100).toFixed(1).replace(".", ",")}`;
const state = {view: "up", league: "all", conf: 0, day: "all"};
const DAYS = [["all", "Tüm günler"], ["today", "Bugün"], ["tomorrow", "Yarın"], ["weekend", "Hafta sonu"]];
const ISO = new Intl.DateTimeFormat("en-CA", {timeZone: "Europe/Istanbul"});          // YYYY-MM-DD, Türkiye saatiyle
const WEEKDAY = new Intl.DateTimeFormat("en-US", {weekday: "short", timeZone: "Europe/Istanbul"});

function dayMatch(m) {
  if (state.day === "all") return true;
  const k = new Date(m.kickoff);
  const today = ISO.format(new Date());
  const tomorrow = ISO.format(new Date(Date.now() + 864e5));
  if (state.day === "today") return ISO.format(k) === today;
  if (state.day === "tomorrow") return ISO.format(k) === tomorrow;
  // Hafta sonu: bugünden itibaren 7 gün içindeki Cumartesi ve Pazar
  return ["Sat", "Sun"].includes(WEEKDAY.format(k)) && ISO.format(k) >= today && k - Date.now() < 7 * 864e5;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"})[c]);

const CONF = [[0, "Tüm tahminler"], [0.6, "%60+ emin"], [0.7, "%70+ emin"]];
const topProb = m => Math.max(m.p_h, m.p_d, m.p_a);

function filtered() {
  return DATA.matches.filter(m => (state.league === "all" || m.league === state.league) && topProb(m) >= state.conf);
}

function summary(rows) {
  const done = rows.filter(m => m.status === "bitti");
  const withOdds = done.filter(m => m.odds_correct != null);
  const correct = done.filter(m => m.correct).length;
  return {
    n: done.length, correct,
    accuracy: done.length ? correct / done.length : null,
    odds: withOdds.length ? withOdds.filter(m => m.odds_correct).length / withOdds.length : null,
    o25: rate(done, "o25_correct"),
    kg: rate(done, "kg_correct"),
  };
}

function rate(rows, key) {
  const r = rows.filter(m => m[key] != null);
  return {n: r.length, correct: r.filter(m => m[key]).length};
}

function statsBlock() {
  const rows = filtered();
  const s = summary(rows);
  const since = Date.now() - 30 * 864e5;
  const recent = summary(rows.filter(m => new Date(m.kickoff) >= since));
  const live = summary(rows.filter(m => m.predicted_at !== "geriye-donuk"));
  const cells = [
    [pct(s.accuracy), "Tahmin başarısı"],
    [`${s.correct} / ${s.n}`, "Doğru / biten maç"],
    [pct(s.odds), "Bahis favorisinin başarısı"],
    [pct(recent.accuracy), "Son 30 gün"],
  ];
  document.getElementById("stats").innerHTML = cells.map(([b, t]) => `<div class="stat"><b>${b}</b><span>${t}</span></div>`).join("");
  document.getElementById("note").textContent =
    (state.conf ? `Yalnızca modelin %${state.conf * 100} veya daha fazla emin olduğu maçlar gösteriliyor. ` : "") +
    (s.o25.n ? `Üst/Alt 2.5: ${s.o25.correct} / ${s.o25.n} doğru (${pct(s.o25.correct / s.o25.n)}). ` : "") +
    (s.kg.n ? `Karşılıklı gol: ${s.kg.correct} / ${s.kg.n} doğru (${pct(s.kg.correct / s.kg.n)}). ` : "") +
    `Canlı takip: ${live.n} maç, ${pct(live.accuracy)} başarı. ` +
    "Sezon başından takip başlangıcına kadarki maçlar geriye dönük hesaplandı; model her maçta yalnızca o maçtan önceki sonuçları gördü.";
}

function probCell(m, o) {
  const p = m["p_" + o.toLowerCase()];
  const odd = m["odds_" + o.toLowerCase()];
  return `<div class="p ${m.pick === o ? "pick" : ""}">
    <div class="k">${OUT[o]}</div><div class="v">${pct(p)}</div>
    <div class="o">${odd ? "oran " + odd.toFixed(2).replace(".", ",") : "&nbsp;"}</div>
    <div class="fill" style="width:${(p * 100).toFixed(0)}%"></div></div>`;
}

function badge(m) {
  if (m.status === "bitti") return m.correct ? `<span class="chip ok">Doğru</span>` : `<span class="chip bad">Yanlış</span>`;
  if (m.status === "sonuc_bekleniyor") return `<span class="chip wait">Sonuç bekleniyor</span>`;
  if (m.status === "ertelendi") return `<span class="chip wait">Ertelendi</span>`;
  return `<span class="chip">Tahmin: ${OUT[m.pick]}</span>`;
}

function goalChips(m) {
  if (m.p_o25 == null) return "";
  const chip = (p, yes, no, key) => {
    const res = m[key] == null ? "" : m[key] ? "ok" : "bad";
    const mark = res === "ok" ? " ✓" : res === "bad" ? " ✗" : "";
    return `<span class="g ${res}">${p >= 0.5 ? yes : no} <b>${pct(Math.max(p, 1 - p))}</b>${mark}</span>`;
  };
  return `<div class="goals">${chip(m.p_o25, "Üst 2.5", "Alt 2.5", "o25_correct")}${chip(m.p_kg, "KG Var", "KG Yok", "kg_correct")}</div>`;
}

function card(m) {
  const k = new Date(m.kickoff);
  const backfilled = m.predicted_at === "geriye-donuk";
  const when = backfilled ? TR.format(k) : `${TR.format(k)} · ${TRT.format(k)}`;
  const mid = m.status === "bitti" ? `${m.fthg} - ${m.ftag}` : "vs";
  return `<article class="match" tabindex="0" role="link" data-key="${esc(matchKey(m))}" aria-label="${esc(m.home)} - ${esc(m.away)} analizi">
    <div class="top"><span><span class="lg">${esc(DATA.leagues[m.league])}</span> ${when}</span>${badge(m)}</div>
    <div class="teams"><span class="a">${esc(m.home)}</span><span class="score">${mid}</span><span>${esc(m.away)}</span></div>
    <div class="probs">${["H", "D", "A"].map(o => probCell(m, o)).join("")}</div>
    ${goalChips(m)}
    <span class="more">Analizi gör →</span>
  </article>`;
}

// Olasılık kalitesi ölçüleri, maç başına (hepsinde düşük daha iyi)
function scores(m) {
  const p = [m.p_h, m.p_d, m.p_a];
  const o = ["H", "D", "A"].map(x => (x === m.ftr ? 1 : 0));
  const brier = p.reduce((s, v, i) => s + (v - o[i]) ** 2, 0);
  const logloss = -Math.log(Math.max(p[o.indexOf(1)], 1e-12));
  const rps = ((p[0] - o[0]) ** 2 + (p[0] + p[1] - o[0] - o[1]) ** 2) / 2;
  return {brier, logloss, rps};
}

const num = (v, d = 3) => v == null ? "–" : v.toFixed(d).replace(".", ",");
const mean = (xs, f) => xs.length ? xs.reduce((s, x) => s + f(x), 0) / xs.length : null;

function table(head, rows) {
  return `<table class="perf"><thead><tr>${head.map(h => `<th scope="col">${h}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
}

function weekStart(d) {
  // Haftanın Pazartesi'si, Türkiye saatiyle
  const local = new Date(ISO.format(d) + "T00:00:00Z");
  local.setUTCDate(local.getUTCDate() - ((local.getUTCDay() + 6) % 7));
  return local.toISOString().slice(0, 10);
}

function perfView() {
  const el = document.getElementById("list");
  const done = filtered().filter(m => m.status === "bitti");
  if (!done.length) { el.innerHTML = `<p class="empty">Henüz biten maç yok.</p>`; return; }
  const sc = done.map(m => ({m, ...scores(m)}));
  const live = sc.filter(x => x.m.predicted_at !== "geriye-donuk");
  const back = sc.filter(x => x.m.predicted_at === "geriye-donuk");
  const row = (name, xs) => [name, xs.length, pct(mean(xs, x => x.m.correct ? 1 : 0)), num(mean(xs, x => x.brier)), num(mean(xs, x => x.logloss)), num(mean(xs, x => x.rps))];
  const quality = table(["", "Maç", "İsabet", "Brier", "Log loss", "RPS"],
    [row("Tümü", sc), ...(live.length ? [row("Canlı", live)] : []), ...(back.length ? [row("Geriye dönük", back)] : [])]);

  // Kalibrasyon: modelin seçtiği sonuca verdiği olasılığa göre gruplar
  const bins = [[0, 0.4, "%40 altı"], [0.4, 0.5, "%40–50"], [0.5, 0.6, "%50–60"], [0.6, 0.7, "%60–70"], [0.7, 1.01, "%70 ve üstü"]];
  const calib = table(["Model ne kadar emindi", "Maç", "Ortalama tahmin", "Gerçekleşen"], bins
    .map(([lo, hi, name]) => [name, sc.filter(x => topProb(x.m) >= lo && topProb(x.m) < hi)])
    .filter(([, xs]) => xs.length)
    .map(([name, xs]) => [name, xs.length, pct(mean(xs, x => topProb(x.m))), pct(mean(xs, x => x.m.correct ? 1 : 0))]));

  // Haftalık seyir, en yeni hafta üstte
  const weeks = {};
  for (const x of sc) (weeks[weekStart(new Date(x.m.kickoff))] ??= []).push(x);
  const weekly = table(["Hafta", "Maç", "İsabet", "Favori", "Brier"], Object.entries(weeks)
    .sort(([a], [b]) => b.localeCompare(a)).slice(0, 12)
    .map(([w, xs]) => {
      const fav = xs.filter(x => x.m.odds_correct != null);
      return [DAY.format(new Date(w)), xs.length, pct(mean(xs, x => x.m.correct ? 1 : 0)), pct(fav.length ? mean(fav, x => x.m.odds_correct ? 1 : 0) : null), num(mean(xs, x => x.brier))];
    }));

  // Model ile bahis favorisinin ayrıştığı maçlar
  const split = done.filter(m => m.odds_pick != null && m.odds_pick !== m.pick);
  const splitText = split.length
    ? `Model ile bahis favorisi ${split.length} maçta farklı sonucu seçti. Bu maçlarda model ${split.filter(m => m.correct).length}, favori ${split.filter(m => m.odds_correct).length} kez haklı çıktı.` +
      (split.length < 50 ? " Örnek henüz küçük, bu fark tesadüf olabilir." : "")
    : "Model şimdiye kadar hep bahis favorisiyle aynı sonucu seçti.";

  el.innerHTML = `
    <h2>Olasılık kalitesi</h2>${quality}
    <p class="explain">İsabet yalnızca en olası sonucun tutup tutmadığına bakar. Brier, log loss ve RPS ise verilen olasılıkların ne kadar yerinde olduğunu ölçer; üçünde de düşük daha iyidir. Örneğin %90 emin olup yanılmak, %50 emin olup yanılmaktan çok daha fazla ceza alır.</p>
    <h2>Kalibrasyon</h2>${calib}
    <p class="explain">İyi bir modelde iki sütun birbirine yakındır: model %60 emin olduğu maçların yaklaşık %60'ında haklı çıkmalıdır.</p>
    <h2>Model ve bahis favorisi</h2><p class="explain">${splitText}</p>
    <h2>Haftalık</h2>${weekly}
    <p class="explain">Hafta Pazartesi günüyle gösterilir. Favori sütunu, bahis oranlarında en düşük orana sahip sonucun başarısıdır.</p>`;
}

function probPanel(m) {
  const hasMk = m.mk_h != null;
  const rows = ["H", "D", "A"].map(o => {
    const p = m["p_" + o.toLowerCase()], q = hasMk ? m["mk_" + o.toLowerCase()] : null, d = q == null ? null : p - q;
    return `<span class="num" style="text-align:left">${OUT[o]}</span>
      <div class="bar" title="Model ${pct(p)}${q == null ? "" : ", piyasa " + pct(q)}"><i style="width:${(p * 100).toFixed(1)}%"></i>${q == null ? "" : `<b style="left:${(q * 100).toFixed(1)}%"></b>`}</div>
      <span class="num">${pct(p)}</span><span class="num">${q == null ? "–" : pct(q)}</span>
      <span class="num ${d == null ? "" : d > 0.005 ? "up" : d < -0.005 ? "down" : ""}">${d == null ? "–" : pts(d)}</span>`;
  }).join("");
  let text;
  if (!hasMk) text = "Bu maç için bahis oranı yok, bu yüzden model yalnızca form ve Elo verisiyle tahmin etti.";
  else {
    const diffs = ["H", "D", "A"].map(o => [o, m["p_" + o.toLowerCase()] - m["mk_" + o.toLowerCase()]]);
    const [o, d] = diffs.reduce((a, b) => Math.abs(b[1]) > Math.abs(a[1]) ? b : a);
    text = Math.abs(d) < 0.02
      ? "Model piyasayla hemen hemen aynı düşünüyor; fark hiçbir sonuçta 2 puanı geçmiyor."
      : `En büyük fark: model ${PICK_NAME[o]} piyasadan ${Math.abs(d * 100).toFixed(1).replace(".", ",")} puan ${d > 0 ? "daha fazla" : "daha az"} şans veriyor.`;
  }
  return `<section class="panel"><h3>Olasılıklar: model ve piyasa</h3>
    <div class="cmp"><span></span><span class="h">Çubuk: model · çizgi: piyasa</span><span class="h num">Model</span><span class="h num">Piyasa</span><span class="h num">Fark</span>${rows}</div>

}

}

function similarPanel(m) {
  const B = DATA.benzer;
  if (!B) return "";
  const p = Math.max(m.p_h, m.p_d, m.p_a);
  const bins = B.bins.filter(b => b.pick === m.pick);
  let i = bins.findIndex(b => p >= b.lo && p < b.hi);
  if (i < 0) return "";
  let lo = i, hi = i, n = bins[i].n;
  while (n < 30 && (lo > 0 || hi < bins.length - 1)) {      // az örnekli kovayı komşularıyla genişlet
    if (lo > 0) lo -= 1;
    if (hi < bins.length - 1) hi += 1;
    n = bins.slice(lo, hi + 1).reduce((s, b) => s + b.n, 0);
  }
  const part = bins.slice(lo, hi + 1), hit = part.reduce((s, b) => s + b.hit, 0);
  const range = `%${Math.round(part[0].lo * 100)}–${Math.round(part.at(-1).hi * 100)}`;
  return `<section class="panel"><h3>Benzer durumlarda geçmiş başarı</h3>
    <p>Son 5 sezonda model ${PICK_NAME[m.pick]} <b>${range}</b> şans verdiğinde, <b>${n}</b> maçın <b>${hit}</b>'inde (${pct(hit / n)}) ${PICK_WIN[m.pick]}.</p>
    <p class="explain">Bu maçta model ${PICK_NAME[m.pick]} ${pct(p)} veriyor. Tablo, aynı modelin her sezonu yalnızca önceki sezonlarla eğitilerek yaptığı ${B.n} tahminden hesaplandı.</p></section>`;
}

function route() {
  const hit = location.hash.match(/^#mac=(.+)$/);
  const detail = document.getElementById("detail");
  const main = ["stats", "note", "list"].map(id => document.getElementById(id)).concat([document.querySelector(".controls")]);
  if (hit) {
    detailView(decodeURIComponent(hit[1]));
    detail.hidden = false;
    main.forEach(e => (e.hidden = true));
    window.scrollTo(0, 0);
  } else {
    detail.hidden = true;
    main.forEach(e => (e.hidden = false));
    render();
  }
}

function render() {
  statsBlock();
  document.getElementById("days").hidden = state.view !== "up";
  for (const id of ["leagues", "conf"]) document.getElementById(id).hidden = state.view === "coup";
  if (state.view === "perf") return perfView();
  if (state.view === "coup") return couponView();
  let rows = filtered();
  rows = state.view === "up"
    ? rows.filter(m => (m.status === "yaklasan" || m.status === "sonuc_bekleniyor") && dayMatch(m)).sort((a, b) => a.kickoff.localeCompare(b.kickoff))
    : rows.filter(m => m.status === "bitti" || m.status === "ertelendi").sort((a, b) => b.kickoff.localeCompare(a.kickoff));
  const el = document.getElementById("list");
  if (!rows.length) {
    el.innerHTML = `<p class="empty">${state.view === "up" ? (state.conf || state.day !== "all" ? "Bu seçimde yaklaşan maç yok." : "Önümüzdeki günlerde maç yok. Fikstür her sabah güncellenir.") : "Henüz biten maç yok."}</p>`;
    return;
  }
  const groups = {};
  for (const m of rows) (groups[TR.format(new Date(m.kickoff))] ??= []).push(m);
  el.innerHTML = Object.entries(groups).map(([day, ms]) => `<h2>${day}</h2><div class="list">${ms.map(card).join("")}</div>`).join("");
}

function setup() {
  const up = new Date(DATA.updated_at);
  const through = Object.entries(DATA.data_through || {})
    .map(([lg, d]) => `${DATA.leagues[lg] || lg} ${DAY.format(new Date(d))}`).join(", ");
  document.getElementById("updated").textContent =
    `Son güncelleme: ${TR.format(up)} ${TRT.format(up)} · model ${DATA.model}` + (through ? ` · son sonuç: ${through}` : "");
  const hours = (Date.now() - up) / 36e5;
  if (hours > STALE_HOURS) {
    const st = document.getElementById("stale");
    st.textContent = `Bu sayfa ${Math.floor(hours)} saattir güncellenmedi. Otomatik çalışmada bir sorun olabilir, tahminler eski olabilir.`;
    st.hidden = false;
  }
  const lg = document.getElementById("leagues");
  const opts = [["all", "Tümü"], ...Object.entries(DATA.leagues)];
  lg.innerHTML = opts.map(([k, v]) => `<button type="button" data-lg="${k}" aria-pressed="${k === "all"}">${esc(v)}</button>`).join("");
  lg.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    state.league = b.dataset.lg;
    lg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
    render();
  });
  const cf = document.getElementById("conf");
  cf.innerHTML = CONF.map(([v, t]) => `<button type="button" data-conf="${v}" aria-pressed="${v === 0}">${t}</button>`).join("");
  cf.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    state.conf = Number(b.dataset.conf);
    cf.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
    render();
  });
  const dy = document.getElementById("days");
  dy.innerHTML = DAYS.map(([k, t]) => `<button type="button" data-day="${k}" aria-pressed="${k === "all"}">${t}</button>`).join("");
  dy.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    state.day = b.dataset.day;
    dy.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
    render();
  });
  const VIEWS = [["v-up", "up"], ["v-done", "done"], ["v-perf", "perf"], ["v-coup", "coup"]];
  for (const [id, view] of VIEWS) {
    document.getElementById(id).addEventListener("click", () => {
      state.view = view;
      for (const [i, v] of VIEWS) document.getElementById(i).setAttribute("aria-pressed", v === view);
      render();
    });
  }
  const list = document.getElementById("list");
  list.addEventListener("click", e => { const c = e.target.closest(".match[data-key]"); if (c) openMatch(c.dataset.key); });
  list.addEventListener("keydown", e => { const c = e.target.closest(".match[data-key]"); if (c && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openMatch(c.dataset.key); } });
  document.getElementById("detail").addEventListener("click", e => { if (e.target.closest(".back")) history.length > 1 && location.hash ? history.back() : (location.hash = ""); });
  window.addEventListener("hashchange", route);
  route();
}
setup();
</script>
