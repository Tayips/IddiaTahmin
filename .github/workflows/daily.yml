name: Günlük tahmin

on:
  schedule:
    - cron: "0 5 * * *"     # 08:00 Türkiye saati
    - cron: "0 14 * * *"    # 17:00 Türkiye saati, akşam maçlarından önce
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -c constraints.txt -e . pytest
      - name: Testler
        run: pytest -q
      - run: python -m iddia.daily
        env:
          FOOTBALL_DATA_ORG_KEY: ${{ secrets.FOOTBALL_DATA_ORG_KEY }}
      - name: Tahminleri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/predictions.csv docs
          if ! git diff --cached --quiet; then
            git commit -m "Günlük tahmin güncellemesi"
            git push
          fi
