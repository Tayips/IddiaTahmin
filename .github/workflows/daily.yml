name: Günlük tahmin

on:
  schedule:
    # Oranlar maça yaklaştıkça güncellenir; tahmin her maçın başlamasından önceki son çalıştırmada donar
    # Her maç için başlamadan 1-2 saat önce bir çalıştırma olsun diye (oranlar o zaman kapanışa yakın)
    - cron: "0 5 * * *"     # 08:00 Türkiye saati
    - cron: "0 10 * * *"    # 13:00 Türkiye saati, öğle maçlarından önce (ör. 14:30 Süper Lig, 12:30 İngiltere)
    - cron: "0 12 * * *"    # 15:00 Türkiye saati, öğleden sonra maçlarından önce
    - cron: "30 15 * * *"   # 18:30 Türkiye saati, akşam maçlarından önce
    - cron: "0 18 * * *"    # 21:00 Türkiye saati, İngiltere hafta içi akşam maçlarından önce (19:30-20:15 UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -c constraints.txt -e . pytest
      # Biten sezonların maç dosyaları her çalıştırmada yeniden indirilmez (12 lig x 13 sezon)
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-
      - name: Testler
        run: pytest -q
      - run: python -m iddia.daily
        env:
          FOOTBALL_DATA_ORG_KEY: ${{ secrets.FOOTBALL_DATA_ORG_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI_KEY || secrets.GOOGLE_API_KEY || secrets.GEMINI }}
      - name: Tahminleri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/predictions.csv data/coupons.csv data/haberler.json docs
          if ! git diff --cached --quiet; then
            git commit -m "Günlük tahmin güncellemesi"
            git push
          fi
