name: Testler

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["data/**", "docs/**"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e . pytest
      - run: pytest -q
